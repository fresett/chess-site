{% extends "base.html" %}
{% block title %}Вход — Ладья{% endblock %}
{% block content %}
<form class="form" method="post" autocomplete="on">
  <h2>Вход</h2>
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Ник<input name="nick" required maxlength="20" autocomplete="username"></label>
  <label>Пароль<input name="password" type="password" required maxlength="128" autocomplete="current-password"></label>
  <button class="btn">Войти</button>
  <p class="muted">Нет аккаунта? <a href="{{ url_for('register') }}">Регистрация</a></p>
</form>
{% if not session.get('guest') %}
<form class="form guestform" method="post" action="{{ url_for('guest') }}">
  <input type="hidden" name="csrf" value="{{ csrf }}"><input type="hidden" name="next" value="/online">
  <b>Без аккаунта?</b>
  <span class="muted">Зайди как гость: можно играть онлайн с другими, но без рейтинга, и партии не сохраняются.</span>
  <button class="btn ghost">👋 Войти как гость</button>
</form>
{% endif %}
{% endblock %}
