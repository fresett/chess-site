{% extends "base.html" %}
{% block title %}Смена пароля — Ладья{% endblock %}
{% block content %}
<form class="form" method="post">
  <h2>Придумай свой пароль</h2>
  <p class="muted formsub">Твой аккаунт создан или пароль сброшен администратором. Перед тем как продолжить, задай собственный пароль — его будешь знать только ты.</p>
  <input type="hidden" name="csrf" value="{{ csrf }}">
  <label>Временный пароль<input name="old" type="password" required autocomplete="current-password"></label>
  <label>Новый пароль (от {{ pw_min }} символов)<input name="new" type="password" required minlength="{{ pw_min }}" maxlength="128" autocomplete="new-password"></label>
  <label>Новый пароль ещё раз<input name="new2" type="password" required minlength="{{ pw_min }}" maxlength="128" autocomplete="new-password"></label>
  <button class="btn">Сохранить пароль</button>
</form>
<form method="post" action="{{ url_for('accounts.logout') }}" class="center"><input type="hidden" name="csrf" value="{{ csrf }}"><button class="btn ghost">Выйти</button></form>
{% endblock %}
